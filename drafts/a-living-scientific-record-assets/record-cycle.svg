<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="610" viewBox="0 0 1020 610" role="img" aria-labelledby="title desc">
<title id="title">The cycle of a living scientific record</title>
<desc id="desc">Content-addressed artifacts and exact versions lead to reviews, explanations, replications and status notices. Both feed independent discovery indexes, which feed curated collections and reading paths, which serve readers, researchers, teachers and students, whose further inquiry and contributions return as new artifacts. Preservation institutions and community governance support the artifacts, the indexes and the collections.</desc>
